server:
  port: 8081
spring:
  application:
    name: evento-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}   # dev | test | prod
  jpa:
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
