# PROD: credenciales por variables de entorno, esquema solo se valida, logs minimos
server:
  port: ${PORT:8083}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_inscripcion?useSSL=true&serverTimezone=America/Lima}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
logging:
  level:
    root: WARN
    pe.edu.lab16: INFO
